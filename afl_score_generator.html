<!doctype html><n<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AFL Score Generator</title><style>body{font:16px system-ui,sans-serif;max-width:720px;margin:24px auto;padding:0 16px;color:#17212b}h1{margin-bottom:4px}button,select{font:inherit;padding:12px;border-radius:10px;border:1px solid #9aa7b2;background:#fff}button{background:#176b45;color:white;border:0;font-weight:700;width:100%;margin:12px 0}table{width:100%;border-collapse:collapse;margin-top:16px}th,td{padding:12px 6px;text-align:center;border-bottom:1px solid #ddd}th:first-child,td:first-child{text-align:left}.muted{color:#65727d;font-size:.9em}.total{font-weight:800}.scores{font-size:1.15em;font-weight:700}</style><h1>🏉 AFL Score Generator</h1><div class="muted">Weighted fictional scores for your quarter-by-quarter game.</div><p><label for="mode">Mode </label> <select id="mode"><option value="match">Full match (two teams)</option><option value="quarter">One quarter (two teams)</option><option value="team">One team's four quarters</option></select></p><button onclick="generate()">🎲 Generate scores</button><div id="out" class="muted">Tap generate to begin.</div><script>
function draw(a){let r=Math.random()*a.reduce((s,x)=>s+x[1],0);for(const [v,w] of a){r-=w;if(r<0)return v}return a[a.length-1][0]}
function score(){let g=draw([[0,2],[1,8],[2,17],[3,22],[4,20],[5,15],[6,9],[7,4],[8,2],[9,.8],[10,.2]]);let b=draw([[0,8],[1,17],[2,23],[3,23],[4,16],[5,8],[6,3],[7,1],[8,.3]]);return {g,b,p:g*6+b}}
function team(n){return Array.from({length:n},score)}function fmt(s){return `<span class="scores">${s.g}.${s.b}</span><br><span class="muted">${s.p} pts</span>`}
function generate(){let mode=document.getElementById('mode').value,o=document.getElementById('out');if(mode==='quarter'){let a=score(),b=score();o.innerHTML=`<table><tr><th>Team</th><th>Quarter score</th><th>Points</th></tr><tr><td>Team A</td><td>${a.g}.${a.b}</td><td>${a.p}</td></tr><tr><td>Team B</td><td>${b.g}.${b.b}</td><td>${b.p}</td></tr></table>`;return}if(mode==='team'){let a=team(4);o.innerHTML=`<table><tr><th>Quarter</th><th>Score</th><th>Points</th></tr>${a.map((s,i)=>`<tr><td>Q${i+1}</td><td>${s.g}.${s.b}</td><td>${s.p}</td></tr>`).join('')}<tr><td class="total">Total</td><td></td><td class="total">${a.reduce((t,s)=>t+s.p,0)}</td></tr></table>`;return}let a=team(4),b=team(4),ta=a.reduce((t,s)=>t+s.p,0),tb=b.reduce((t,s)=>t+s.p,0);o.innerHTML=`<table><tr><th>Team</th>${[1,2,3,4].map(i=>`<th>Q${i}</th>`).join('')}<th>Total</th></tr><tr><td>Team A</td>${a.map(s=>`<td>${s.g}.${s.b}<br><span class="muted">${s.p}</span></td>`).join('')}<td class="total">${ta}</td></tr><tr><td>Team B</td>${b.map(s=>`<td>${s.g}.${s.b}<br><span class="muted">${s.p}</span></td>`).join('')}<td class="total">${tb}</td></tr></table><p><b>${ta===tb?'Scores level':ta>tb?'Team A wins':'Team B wins'}</b> — margin ${Math.abs(ta-tb)} points</p>`}
</script></html>
